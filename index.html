<script>
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function formatRupiah(num) { return 'Rp ' + (Number(num)||0).toLocaleString('id-ID'); }
  function getStatusED(tglED) {
    if (!tglED) return '';
    const ed = new Date(tglED);
    if (isNaN(ed.getTime())) return '';
    ed.setHours(0,0,0,0);
    const today = new Date(); today.setHours(0,0,0,0);
    if (ed <= today) return 'EXPIRED DATE';
    const diff = Math.round((ed - today) / (1000*60*60*24));
    if (diff <= 90) return 'NEAR ED3';
    if (diff <= 180) return 'NEAR ED6';
    return 'AMAN';
  }
  function formatDate(val) {
    if (!val) return '';
    const d = new Date(val);
    if (isNaN(d.getTime())) return val;
    return d.toLocaleDateString('id-ID', { day:'2-digit', month:'2-digit', year:'numeric' });
  }
  function statusBadge(status) {
    const cls = { 'EXPIRED DATE':'badge-ed-EXPIRED','NEAR ED3':'badge-ed-NEAR3','NEAR ED6':'badge-ed-NEAR6','AMAN':'badge-ed-AMAN' }[status] || '';
    return status ? `<span class="badge ${cls}">${status}</span>` : '-';
  }
  function statusKirimBadge(s) {
    const map = { 'Menunggu Dikirim ke Gudang Utama':'badge-kirim-menunggu','Diterima Gudang Utama':'badge-kirim-diterima','Draft':'badge-kirim-draft','Dibatalkan':'badge-kirim-dibatalkan','Dimusnahkan':'badge-kirim-dibatalkan' };
    return `<span class="badge ${map[s]||''}">${s}</span>`;
  }
  function statusBarangBadge(status) {
    const c = { 'FAST MOVING': {bg:'#2E7D32',color:'#fff'}, 'SLOW MOVING': {bg:'#FDD835',color:'#000'}, 'DEATH STOCK': {bg:'#000',color:'#fff'} }[status];
    if (!c) return status || '-';
    return `<span class="badge" style="background:${c.bg};color:${c.color};">${status}</span>`;
  }

  const $ = id => document.getElementById(id);
  const alertBox = $('alertBox');
  const alertDash = $('alertBoxDash');

  function showAlert(type, msg, isDash) {
    const box = isDash ? alertDash : alertBox;
    if (!box) return;
    box.className = 'alert show ' + (type==='success' ? 'alert-success' : 'alert-error');
    box.textContent = msg;
    setTimeout(() => box.classList.remove('show'), 6000);
  }

  let staffList = [], barangList = [], unitMap = {};
  let rawRowsRiwayat = [], allRowsRiwayat = [], currentPageRiwayat = 1;
  let serverRowsMain = [], allRowsMain = [], currentPageMain = 1;
  let serverRowsMonitoring = [], allRowsMonitoring = [], currentPageMonitoring = 1;
  let allRowsExpired = [], currentPageExpired = 1;
  let allRowsArsip = [], currentPageArsip = 1;
  let allRowsBarang = [], currentPageBarang = 1;
  const PAGE_SIZE = 10;
  let dashboardPassword = '';
  let currentIdRetur = null, currentEditIdRetur = null, currentEditKodeBarang = null;

  async function loadUnits() {
    const { data, error } = await supabaseClient.from('unit').select('id, nama').order('nama');
    if (error) { console.error('loadUnits error:', error); throw error; }
    data.forEach(u => unitMap[u.id] = u.nama);
    return data;
  }

  async function loadStaff() {
    try {
      if (Object.keys(unitMap).length === 0) await loadUnits();
      const { data, error } = await supabaseClient.from('daftar_petugas').select('nama, unit_id');
      if (error) throw error;
      if (!data || data.length === 0) {
        staffList = [];
        return [];
      }
      staffList = data.map(r => ({ nama: r.nama, unit: unitMap[r.unit_id] || 'Unit tidak dikenal' }));
      return staffList;
    } catch (err) {
      staffList = [];
      return [];
    }
  }

  async function loadBarang() {
    const { data, error } = await supabaseClient.from('data_barang').select('kode_barang, nama_barang, harga_satuan');
    if (error) throw error;
    barangList = data.map(r => ({ id: r.kode_barang, nama: r.nama_barang, harga: r.harga_satuan }));
    return barangList;
  }

  function renderAutocomplete(container, items, labelFn, onSelect) {
    container.innerHTML = '';
    if (!items || items.length===0) { container.classList.remove('show'); return; }
    items.forEach(item => {
      const div = document.createElement('div');
      div.className = 'autocomplete-item';
      div.innerHTML = labelFn(item);
      div.addEventListener('click', () => { onSelect(item); container.classList.remove('show'); });
      container.appendChild(div);
    });
    container.classList.add('show');
  }

  $('searchNama').addEventListener('input', function() {
    const q = this.value.trim().toLowerCase();
    $('namaPetugas').value = ''; $('unitAsal').value = '';
    if (!q) { $('listNama').classList.remove('show'); return; }
    const matches = staffList.filter(s => s.nama.toLowerCase().includes(q)).slice(0, 8);
    renderAutocomplete($('listNama'), matches,
      item => item.nama + '<div class="sub-info">' + item.unit + '</div>',
      item => { $('searchNama').value = item.nama; $('namaPetugas').value = item.nama; $('unitAsal').value = item.unit; }
    );
  });

  $('searchBarang').addEventListener('input', function() {
    const q = this.value.trim().toLowerCase();
    $('idBarang').value = ''; $('hargaSatuan').value = ''; $('hargaSatuanDisplay').value = '';
    if (!q) { $('listBarang').classList.remove('show'); return; }
    const matches = barangList.filter(b => b.nama.toLowerCase().includes(q) || b.id.toLowerCase().includes(q)).slice(0, 8);
    renderAutocomplete($('listBarang'), matches,
      item => item.nama + '<div class="sub-info">' + item.id + '</div>',
      item => { $('searchBarang').value = item.nama; $('idBarang').value = item.id; $('hargaSatuan').value = item.harga; $('hargaSatuanDisplay').value = formatRupiah(item.harga); }
    );
  });

  document.addEventListener('click', e => {
    if (!e.target.closest('.field')) { $('listNama').classList.remove('show'); $('listBarang').classList.remove('show'); $('listNamaGudang').classList.remove('show'); }
  });

  $('tglED').addEventListener('change', function() {
    $('statusEDPreview').textContent = this.value ? 'Status ED: ' + getStatusED(this.value) : '';
  });

  $('returForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const namaPetugas = $('namaPetugas').value;
    const unitAsal = $('unitAsal').value;
    const idBarang = $('idBarang').value;
    const namaBarang = $('searchBarang').value;
    if (!namaPetugas) return showAlert('error', 'Pilih nama petugas.');
    if (!idBarang) return showAlert('error', 'Pilih nama barang.');
    const unitId = Object.keys(unitMap).find(key => unitMap[key] === unitAsal);
    if (!unitId) return showAlert('error', 'Unit tidak valid.');

    const payload = {
      tglRetur: $('tglRetur').value, idBarang: idBarang, namaBarang: namaBarang,
      jumlah: $('jumlah').value, noBatch: $('noBatch').value, tglED: $('tglED').value,
      statusBarang: $('statusBarang').value, namaPetugas: namaPetugas,
      unitId: parseInt(unitId), hargaSatuan: $('hargaSatuan').value
    };

    const btn = $('btnSubmit');
    btn.disabled = true; btn.textContent = 'Mengirim...';
    try {
      const result = await submitRetur(payload);
      showAlert('success', 'Berhasil! ID: ' + result.idRetur);
      $('returForm').reset();
      $('unitAsal').value = ''; $('hargaSatuanDisplay').value = '';
      $('tglRetur').valueAsDate = new Date();
      if ($('filterUnitRiwayat').value) loadRiwayat(parseInt($('filterUnitRiwayat').value));
    } catch (err) { showAlert('error', err.message); }
    finally { btn.disabled = false; btn.textContent = 'Kirim Laporan Retur'; }
  });

  async function submitRetur(form) {
    const { data: idRetur, error: idError } = await supabaseClient.rpc('generate_id_retur');
    if (idError || !idRetur) throw new Error('Gagal generate ID: ' + (idError?.message || ''));
    const jumlah = Number(form.jumlah) || 0;
    const harga = Number(form.hargaSatuan) || 0;
    const { error } = await supabaseClient.from('master_data').insert([{
      id_retur: idRetur, tgl_retur: form.tglRetur, id_barang: form.idBarang,
      nama_barang: form.namaBarang, jumlah: jumlah, no_batch: form.noBatch,
      tgl_ed: form.tglED, status_barang: form.statusBarang, status_ed: getStatusED(form.tglED),
      nama_petugas: form.namaPetugas, unit_id: form.unitId, status_pengiriman: 'Draft',
      harga_satuan_snapshot: harga, nilai: jumlah * harga
    }]);
    if (error) throw error;
    return { idRetur };
  }

  async function loadRiwayat(unitId) {
    if (!unitId) { rawRowsRiwayat = []; allRowsRiwayat = []; renderRiwayat(); return; }
    $('tableBodyRiwayat').innerHTML = '<tr><td colspan="9" style="text-align:center;padding:20px;">Memuat...</td></tr>';
    try {
      const { data, error } = await supabaseClient.from('master_data').select('*').eq('unit_id', unitId).order('created_at', { ascending: false }).limit(1000);
      if (error) throw error;
      rawRowsRiwayat = data.map(r => {
        const statusED = getStatusED(r.tgl_ed);
        return { ...r, statusED, bisaDiedit: r.status_pengiriman === 'Draft' || r.status_pengiriman === 'Menunggu Dikirim ke Gudang Utama', bisaDikirim: r.status_pengiriman === 'Draft' && statusED === 'EXPIRED DATE', bisaDibatalkan: r.status_pengiriman === 'Draft' || r.status_pengiriman === 'Menunggu Dikirim ke Gudang Utama' };
      });
      applyRiwayatSort();
    } catch (err) { showAlert('error', 'Gagal memuat riwayat: ' + err.message); rawRowsRiwayat = []; allRowsRiwayat = []; renderRiwayat(); }
  }

  function applyRiwayatSort() {
    const query = ($('searchRiwayat').value || '').trim().toLowerCase();
    const sortBy = $('sortRiwayat').value;
    let filtered = rawRowsRiwayat.slice();
    if (query) filtered = filtered.filter(r => (r.nama_barang||'').toLowerCase().includes(query) || (r.id_retur||'').toLowerCase().includes(query) || (r.no_batch||'').toLowerCase().includes(query));
    switch (sortBy) {
      case 'tgl_retur_terbaru': filtered.sort((a,b) => a.id_retur < b.id_retur ? 1 : -1); break;
      case 'tgl_retur_terlama': filtered.sort((a,b) => a.id_retur > b.id_retur ? 1 : -1); break;
      case 'nama_az': filtered.sort((a,b) => (a.nama_barang||'').localeCompare(b.nama_barang||'')); break;
      case 'nama_za': filtered.sort((a,b) => (b.nama_barang||'').localeCompare(a.nama_barang||'')); break;
      case 'ed_terdekat': filtered.sort((a,b) => new Date(a.tgl_ed) - new Date(b.tgl_ed)); break;
      case 'ed_terjauh': filtered.sort((a,b) => new Date(b.tgl_ed) - new Date(a.tgl_ed)); break;
      case 'jumlah_terbesar': filtered.sort((a,b) => (b.jumlah||0) - (a.jumlah||0)); break;
      case 'jumlah_terkecil': filtered.sort((a,b) => (a.jumlah||0) - (b.jumlah||0)); break;
    }
    allRowsRiwayat = filtered; currentPageRiwayat = 1; renderRiwayat();
  }

  function renderRiwayat() {
    const tbody = $('tableBodyRiwayat'); const empty = $('emptyStateRiwayat');
    tbody.innerHTML = '';
    if (!allRowsRiwayat || allRowsRiwayat.length === 0) { empty.style.display = 'block'; $('paginationRiwayat').innerHTML = ''; return; }
    empty.style.display = 'none';
    const start = (currentPageRiwayat-1)*PAGE_SIZE;
    const pageRows = allRowsRiwayat.slice(start, start+PAGE_SIZE);
    pageRows.forEach(r => {
      const tr = document.createElement('tr');
      let aksi = '';
      if (r.bisaDikirim) aksi += `<button class="btn btn-sm" style="background:var(--danger);margin-right:6px;" onclick="kirimKeGudangHandler('${r.id_retur}')">Kirim</button>`;
      if (r.bisaDiedit) aksi += `<button class="btn btn-sm" style="margin-right:6px;" onclick="openEditModal('${r.id_retur}',${r.jumlah},'${r.nama_barang.replace(/'/g,"\\'")}')">Edit</button>`;
      if (r.bisaDibatalkan) aksi += `<button class="btn btn-sm" style="background:#6B7280;" onclick="batalkanLaporanHandler('${r.id_retur}')">Batalkan</button>`;
      if (!aksi) aksi = '<span class="hint">Terkunci</span>';
      tr.innerHTML = `<td>${r.id_retur}</td><td>${formatDate(r.tgl_retur)}</td><td>${r.nama_barang}</td><td>${r.jumlah}</td><td>${r.no_batch||'-'}</td><td>${formatDate(r.tgl_ed)}</td><td>${statusBadge(r.statusED)}</td><td>${statusKirimBadge(r.status_pengiriman)}</td><td>${aksi}</td>`;
      tbody.appendChild(tr);
    });
    renderPagination('paginationRiwayat', allRowsRiwayat.length, currentPageRiwayat, p => { currentPageRiwayat = p; renderRiwayat(); });
  }

  function renderPagination(id, total, current, onChange) {
    const container = $(id); const pages = Math.ceil(total/PAGE_SIZE);
    container.innerHTML = '';
    if (pages <= 1) return;
    const prev = document.createElement('button'); prev.textContent = '‹ Sebelumnya'; prev.disabled = current === 1; prev.onclick = () => onChange(current-1);
    const info = document.createElement('span'); info.className = 'page-info'; info.textContent = `Halaman ${current} dari ${pages} (${total} data)`;
    const next = document.createElement('button'); next.textContent = 'Berikutnya ›'; next.disabled = current === pages; next.onclick = () => onChange(current+1);
    container.append(prev, info, next);
  }

  window.kirimKeGudangHandler = async function(idRetur) {
    if (!confirm('Kirim ' + idRetur + ' ke Gudang?')) return;
    try {
      const { data, error } = await supabaseClient.from('master_data').select('status_pengiriman, tgl_ed').eq('id_retur', idRetur).single();
      if (error) throw error;
      if (data.status_pengiriman !== 'Draft') throw new Error('Sudah dikirim.');
      if (getStatusED(data.tgl_ed) !== 'EXPIRED DATE') throw new Error('Hanya EXPIRED DATE yang bisa dikirim.');
      await supabaseClient.from('master_data').update({ status_pengiriman: 'Menunggu Dikirim ke Gudang Utama' }).eq('id_retur', idRetur);
      showAlert('success', idRetur + ' dikirim.');
      if ($('filterUnitRiwayat').value) loadRiwayat(parseInt($('filterUnitRiwayat').value));
    } catch (err) { showAlert('error', err.message); }
  };

  window.batalkanLaporanHandler = async function(idRetur) {
    if (!confirm('Batalkan ' + idRetur + '?')) return;
    try {
      const { data, error } = await supabaseClient.from('master_data').select('status_pengiriman').eq('id_retur', idRetur).single();
      if (error) throw error;
      if (data.status_pengiriman === 'Diterima Gudang Utama') throw new Error('Sudah diterima.');
      if (data.status_pengiriman === 'Dibatalkan') throw new Error('Sudah dibatalkan.');
      await supabaseClient.from('master_data').update({ status_pengiriman: 'Dibatalkan' }).eq('id_retur', idRetur);
      showAlert('success', idRetur + ' dibatalkan.');
      if ($('filterUnitRiwayat').value) loadRiwayat(parseInt($('filterUnitRiwayat').value));
    } catch (err) { showAlert('error', err.message); }
  };

  window.openEditModal = function(idRetur, jumlah, namaBarang) {
    $('editIdRetur').textContent = idRetur; $('editNamaBarang').textContent = namaBarang;
    $('editJumlahBaru').value = jumlah; currentEditIdRetur = idRetur;
    $('modalEditOverlay').classList.add('show');
  };
  $('btnBatalEdit').onclick = () => $('modalEditOverlay').classList.remove('show');
  $('btnSimpanEdit').onclick = async function() {
    const jumlah = $('editJumlahBaru').value;
    if (!jumlah || Number(jumlah) <= 0) return showAlert('error', 'Jumlah > 0');
    try {
      const { data, error } = await supabaseClient.from('master_data').select('harga_satuan_snapshot, status_pengiriman').eq('id_retur', currentEditIdRetur).single();
      if (error) throw error;
      if (data.status_pengiriman === 'Diterima Gudang Utama') throw new Error('Tidak bisa diedit.');
      const nilai = Number(jumlah) * (data.harga_satuan_snapshot || 0);
      await supabaseClient.from('master_data').update({ jumlah: Number(jumlah), nilai: nilai }).eq('id_retur', currentEditIdRetur);
      showAlert('success', 'Jumlah diubah.');
      $('modalEditOverlay').classList.remove('show');
      if ($('filterUnitRiwayat').value) loadRiwayat(parseInt($('filterUnitRiwayat').value));
    } catch (err) { showAlert('error', err.message); }
  };

  // ============ DASHBOARD ============
  let isDashboardUnlocked = false;

  $('btnMasukDashboard').addEventListener('click', async function() {
    const pw = $('dashboardPassword').value;
    const errBox = $('passwordError');
    if (!pw) return;
    this.disabled = true; this.textContent = 'Memeriksa...';
    try {
      const { data, error } = await supabaseClient.from('app_settings').select('value').eq('key', 'dashboard_password').single();
      if (error) throw error;
      if (data.value === pw) {
        dashboardPassword = pw;
        sessionStorage.setItem('dashboardPassword', pw);
        unlockDashboard();
      } else {
        errBox.textContent = 'Kata sandi salah.';
        errBox.classList.add('show');
      }
    } catch (err) { errBox.textContent = 'Error: ' + err.message; errBox.classList.add('show'); }
    finally { this.disabled = false; this.textContent = 'Masuk'; }
  });

  $('dashboardPassword').addEventListener('keypress', e => { if (e.key === 'Enter') $('btnMasukDashboard').click(); });

  function unlockDashboard() {
    isDashboardUnlocked = true;
    $('passwordGate').style.display = 'none';
    $('dashboardContent').style.display = 'block';
    initDashboard();
  }

  const tabLoaded = { monitoring: false, retur: false, expired: false, arsip: false, barang: false };

  function setupSidebar() {
    document.querySelectorAll('.sidebar-item').forEach(btn => {
      btn.addEventListener('click', function() {
        const target = this.dataset.tab;
        document.querySelectorAll('.sidebar-item').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.style.display = 'none');
        this.classList.add('active');
        const panel = document.getElementById('tab-' + target);
        if (panel) panel.style.display = 'block';
        if (!tabLoaded[target]) {
          tabLoaded[target] = true;
          if (target === 'monitoring') loadMonitoring();
          else if (target === 'retur') loadData();
          else if (target === 'expired') loadExpired();
          else if (target === 'arsip') loadArsip();
          else if (target === 'barang') loadBarangManagement();
        }
      });
    });
  }

  function initDashboard() {
    supabaseClient.from('unit').select('id, nama').order('nama').then(({ data }) => {
      const selects = ['filterUnit', 'filterUnitArsip', 'filterUnitExpired', 'filterUnitMonitoring'];
      selects.forEach(id => {
        const sel = $(id);
        if (!sel) return;
        sel.innerHTML = '<option value="SEMUA">Semua Unit</option>';
        data.forEach(u => { const opt = document.createElement('option'); opt.value = u.id; opt.textContent = u.nama; sel.appendChild(opt); });
      });
    });

    supabaseClient.from('daftar_petugas').select('nama, unit_id').then(({ data }) => {
      if (data) staffList = data.map(r => ({ nama: r.nama, unit: unitMap[r.unit_id] || '' }));
    });

    setupSidebar();
    setupDashboardEvents();

    tabLoaded.monitoring = true;
    document.getElementById('tab-monitoring').style.display = 'block';
    loadMonitoring();
  }

  function setupDashboardEvents() {
    $('btnLoadMonitoring').addEventListener('click', loadMonitoring);
    $('filterNamaBarangMonitoring').addEventListener('input', applyClientFiltersMonitoring);
    $('filterStatusBarangMonitoring').addEventListener('change', applyClientFiltersMonitoring);
    $('filterUnit').addEventListener('change', loadData);
    $('filterStatus').addEventListener('change', loadData);
    $('filterStart').addEventListener('change', loadData);
    $('filterEnd').addEventListener('change', loadData);
    $('btnRefresh').addEventListener('click', loadData);
    $('btnResetFilter').addEventListener('click', function() {
      $('filterUnit').value = 'SEMUA'; $('filterStatus').value = 'Menunggu Dikirim ke Gudang Utama';
      $('filterStart').value = ''; $('filterEnd').value = '';
      loadData();
    });
    $('btnLoadExpired').addEventListener('click', loadExpired);
    $('btnLoadArsip').addEventListener('click', loadArsip);
    document.querySelectorAll('#navDashboardBack, #navDashboardBack2').forEach(el => {
      el.addEventListener('click', e => { e.preventDefault(); $('navInput').click(); });
    });
    $('btnCetakMonitoring').addEventListener('click', () => exportToExcel(allRowsMonitoring, 'Laporan Monitoring', 'Laporan_Monitoring'));
    $('btnCetakMain').addEventListener('click', () => exportToExcel(allRowsMain, 'Laporan Retur Masuk', 'Laporan_Retur_Masuk'));
    $('btnCetakExpired').addEventListener('click', () => exportToExcel(allRowsExpired, 'Laporan Expired Diterima', 'Laporan_Expired_Diterima'));
    $('btnCetakArsip').addEventListener('click', () => exportToExcel(allRowsArsip, 'Laporan Arsip', 'Laporan_Arsip'));
    $('btnPrintMonitoring').addEventListener('click', () => printPreview(allRowsMonitoring, 'Laporan Monitoring'));
    $('btnPrintMain').addEventListener('click', () => printPreview(allRowsMain, 'Laporan Retur Masuk'));
    $('btnPrintExpired').addEventListener('click', () => printPreview(allRowsExpired, 'Laporan Expired Diterima'));
    $('btnPrintArsip').addEventListener('click', () => printPreview(allRowsArsip, 'Laporan Arsip'));
    // Kelola Barang
    $('btnTambahBarang').addEventListener('click', tambahBarangHandler);
    $('btnRefreshBarang').addEventListener('click', loadBarangManagement);
    $('filterNamaBarangKelola').addEventListener('input', applyFilterBarang);
    $('btnCetakBarang').addEventListener('click', () => exportToExcelBarang(allRowsBarang));
    $('btnBatalEditBarang').onclick = () => $('modalEditBarangOverlay').classList.remove('show');
    $('btnSimpanEditBarang').onclick = simpanEditBarangHandler;
  }

  async function loadMonitoring() {
    const unit = $('filterUnitMonitoring').value;
    const statusED = $('filterStatusEDMonitoring').value;
    const start = $('filterStartMonitoring').value;
    const end = $('filterEndMonitoring').value;
    $('tableBodyMonitoring').innerHTML = '<tr><td colspan="12" style="text-align:center;padding:20px;">Memuat...</td></tr>';
    try {
      let query = supabaseClient.from('master_data').select('*, unit(nama)').not('status_pengiriman', 'in', '("Diterima Gudang Utama","Dibatalkan","Dimusnahkan")');
      if (unit && unit !== 'SEMUA') query = query.eq('unit_id', parseInt(unit));
      if (start) query = query.gte('tgl_retur', start);
      if (end) query = query.lte('tgl_retur', end);
      const { data, error } = await query.order('created_at', { ascending: false });
      if (error) throw error;
      const rows = data.map(r => ({ ...r, statusED: getStatusED(r.tgl_ed), unitNama: r.unit?.nama || '' }));
      let filtered = rows;
      if (statusED && statusED !== 'SEMUA') filtered = filtered.filter(r => r.statusED === statusED);
      serverRowsMonitoring = filtered;
      applyClientFiltersMonitoring();
      updateHeaderStats(rows);
    } catch (err) { showAlert('error', 'Gagal memuat monitoring: ' + err.message, true); }
  }

  function applyClientFiltersMonitoring() {

  function applyFilterBarang() {
    const q = ($('filterNamaBarangKelola').value || '').trim().toLowerCase();
    let filtered = allRowsBarang;
    if (q) filtered = allRowsBarang.filter(b => (b.nama_barang||'').toLowerCase().includes(q) || (b.kode_barang||'').toLowerCase().includes(q));
    renderPageBarang(filtered);
  }

  function renderPageBarang(rows) {
    const tbody = $('tableBodyBarang'); const empty = $('emptyStateBarang');
    tbody.innerHTML = '';
    if (!rows || rows.length === 0) { empty.style.display = 'block'; $('paginationBarang').innerHTML = ''; return; }
    empty.style.display = 'none';
    const start = (currentPageBarang - 1) * PAGE_SIZE;
    rows.slice(start, start + PAGE_SIZE).forEach(b => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${b.kode_barang}</td>
        <td>${b.nama_barang}</td>
        <td>${formatRupiah(b.harga_satuan)}</td>
        <td>
          <button class="btn btn-sm" style="margin-right:4px;" onclick="openEditBarangModal('${b.kode_barang}')">✏️ Edit</button>
          <button class="btn btn-sm" style="background:#B91C1C;" onclick="hapusBarangHandler('${b.kode_barang}','${(b.nama_barang||'').replace(/'/g, "\\'")}')">🗑️ Hapus</button>
        </td>`;
      tbody.appendChild(tr);
    });
    const pages = Math.ceil(rows.length / PAGE_SIZE);
    const container = $('paginationBarang');
    container.innerHTML = '';
    if (pages > 1) {
      const prev = document.createElement('button'); prev.textContent = '‹ Sebelumnya'; prev.disabled = currentPageBarang === 1;
      prev.onclick = () => { currentPageBarang--; renderPageBarang(rows); };
      const info = document.createElement('span'); info.className = 'page-info';
      info.textContent = `Halaman ${currentPageBarang} dari ${pages} (${rows.length} data)`;
      const next = document.createElement('button'); next.textContent = 'Berikutnya ›'; next.disabled = currentPageBarang === pages;
      next.onclick = () => { currentPageBarang++; renderPageBarang(rows); };
      container.append(prev, info, next);
    }
  }

    const kode = $('newKodeBarang').value.trim();

    if (!kode) return showAlert('error', 'Kode barang wajib diisi.', true);

      showAlert('success', 'Barang "' + nama + '" berhasil ditambahkan.', true);
      $('newKodeBarang').value = ''; $('newNamaBarang').value = ''; $('newHargaSatuan').value = '';

  function exportToExcel(rows, judul, namaFile) {

    const header = ['ID Retur', 'Tgl Retur', 'Unit', 'Barang', 'Jml', 'Batch', 'Tgl ED', 'Status ED', 'Nilai'];
    const dataRows = rows.map(r => [r.id_retur, formatDate(r.tgl_retur), r.unitNama||'', r.nama_barang, r.jumlah, r.no_batch||'', formatDate(r.tgl_ed), r.statusED, r.nilai||0]);
    const totalRow = ['', '', '', '', '', '', 'TOTAL NILAI', '', rows.reduce((s,r) => s+(r.nilai||0), 0)];
    const wsData = [[judul], [], header, ...dataRows, totalRow];
    const ws = XLSX.utils.aoa_to_sheet(wsData);
    ws['!cols'] = header.map(() => ({ wch: 16 }));
    ws['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: header.length-1 } }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Laporan');
    XLSX.writeFile(wb, namaFile + '_' + new Date().toISOString().split('T')[0] + '.xlsx');
  }

  function printPreview(rows, judul) {
    if (!rows || rows.length === 0) return showAlert('error', 'Tidak ada data untuk dicetak.', true);
    const header = ['ID Retur', 'Tgl Retur', 'Unit', 'Barang', 'Jml', 'Batch', 'Tgl ED', 'Status ED', 'Nilai'];
    const rowsHtml = rows.map(r => `<tr><td>${r.id_retur}</td><td>${formatDate(r.tgl_retur)}</td><td>${r.unitNama||''}</td><td>${r.nama_barang}</td><td>${r.jumlah}</td><td>${r.no_batch||''}</td><td>${formatDate(r.tgl_ed)}</td><td>${r.statusED}</td><td style="text-align:right;">${formatRupiah(r.nilai)}</td></tr>`).join('');
    const total = rows.reduce((s,r) => s+(r.nilai||0), 0);
    const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${judul}</title><style>@page{size:landscape;margin:12mm;}body{font-family:Arial;font-size:11px;}h1{text-align:center;font-size:16px;}table{width:100%;border-collapse:collapse;}th,td{border:1px solid #999;padding:5px 7px;}th{background:#2E7D32;color:#fff;}</style></head><body><h1>${judul}</h1><p>Dicetak: ${new Date().toLocaleDateString('id-ID')}</p><table><thead><tr>${header.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rowsHtml}<tr style="font-weight:700;background:#E3F5EA;"><td colspan="7" style="text-align:right;">TOTAL NILAI</td><td></td><td style="text-align:right;">${formatRupiah(total)}</td></tr></tbody></table></body></html>`;
    const win = window.open('', '_blank');
    if (!win) return showAlert('error', 'Pop-up diblokir.', true);
    win.document.write(html); win.document.close();
    win.onload = () => { win.focus(); win.print(); };
  }

  $('btnTutorial').onclick = () => $('modalTutorialOverlay').classList.add('show');
  $('btnTutupTutorial2').onclick = () => $('modalTutorialOverlay').classList.remove('show');
  $('modalTutorialOverlay').addEventListener('click', e => { if (e.target === e.currentTarget) $('modalTutorialOverlay').classList.remove('show'); });

  // ============ INIT ============
  (async function init() {
    try {
      const units = await loadUnits();
      const sel = $('filterUnitRiwayat');
      sel.innerHTML = '<option value="">-- Pilih --</option>';
      units.forEach(u => { const opt = document.createElement('option'); opt.value = u.id; opt.textContent = u.nama; sel.appendChild(opt); });
      await loadStaff();
      await loadBarang();
      $('tglRetur').valueAsDate = new Date();
      $('filterUnitRiwayat').addEventListener('change', function() { loadRiwayat(parseInt(this.value)); });
      $('searchRiwayat').addEventListener('input', applyRiwayatSort);
      $('sortRiwayat').addEventListener('change', applyRiwayatSort);
    } catch (err) {
      showAlert('error', 'Gagal inisialisasi: ' + err.message);
    }
  })();
</script>
</body>
</html>
